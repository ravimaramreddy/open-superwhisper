name: Local dictation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - uses: astral-sh/setup-uv@v6
      - name: Check code and types
        run: npm run quality-check
      - name: Check Python runtime code
        run: npm run lint:python
      - name: Test the active desktop application
        run: npm test
      - name: Test the Python protocol without loading models
        run: npm run test:python
      - name: Build the renderer
        run: npm run build:renderer

  native-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile the macOS delivery helper
        run: node scripts/build-local-native.js
